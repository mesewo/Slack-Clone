apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: storage-service }
  template:
    metadata:
      labels: { app: storage-service }
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames: ["host.docker.internal"]
      containers:
        - name: storage-service
          image: slack-clone/storage-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9094 }, { containerPort: 9194 }]
          env:
            - name: STORAGE_GRPC_ADDR
              value: ":9094"
            - name: STORAGE_METRICS_ADDR
              value: ":9194"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@host.docker.internal:5432/slack_db?sslmode=disable"
            - name: S3_ENDPOINT
              value: host.docker.internal:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: S3_SECRET_KEY }
            - name: S3_BUCKET
              value: slack-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
spec:
  selector: { app: storage-service }
  ports:
    - { name: grpc, port: 9094, targetPort: 9094 }
    - { name: metrics, port: 9194, targetPort: 9194 }
