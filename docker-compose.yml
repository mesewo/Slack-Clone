services:
  postgres:
    image: postgres:16-alpine
    container_name: slack_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${postgrespassword}
      POSTGRES_DB: slack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: