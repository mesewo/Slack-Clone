services:
  channel-service:
    image: golang:1.26.5
    working_dir: /workspace
    command: ["go", "run", "./apps/api/services/channel/cmd/channel-service"]
    environment:
      CHANNEL_GRPC_ADDR: ":9092"
    ports:
      - "9092:9092"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod

  user-service:
    image: golang:1.26.5
    working_dir: /workspace/apps/api/services/user
    command: ["go", "run", "./cmd/user-service"]
    environment:
      USER_GRPC_ADDR: ":9093"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/slack_db?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
    depends_on:
      - postgres
      - redis

  core:
    image: golang:1.26.5
    working_dir: /workspace/apps/api
    command: ["go", "run", "./cmd/core"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/slack_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORE_HTTP_ADDR: ":8080"
      CORE_GRPC_ADDR: "0.0.0.0:9091"
      CORE_NODE_ID: core-1
      CORE_NODE_ADDRESS: core:9091
      GATEWAY_GRPC_ADDR: gateway:9090
      CHANNEL_GRPC_ADDR: channel-service:9092
      USER_GRPC_ADDR: user-service:9093
      KAFKA_BROKER_ADDR: redpanda:9092
      REDIS_ADDR: redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: slack-uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
      - "9091:9091"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
    depends_on:
      - postgres
      - redpanda
      - redis
      - elasticsearch
      - minio
      - channel-service
      - user-service
      - gateway

  gateway:
    image: golang:1.26.5
    working_dir: /workspace/apps/api
    command: ["go", "run", "./cmd/gateway"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORE_GRPC_ADDR: core:9091
      GATEWAY_GRPC_ADDR: "0.0.0.0:9090"
      GATEWAY_HTTP_ADDR: ":8081"
      REDIS_ADDR: redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8081:8081"
      - "9090:9090"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: slack_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: slack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: slack_redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  redis:
    image: redis:7-alpine
    container_name: slack_redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: slack_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: slack_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  go-mod-cache:
  postgres_data:
  elasticsearch_data:
  minio_data:
