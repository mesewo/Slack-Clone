apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames: ["host.docker.internal"]
      containers:
        - name: user-service
          image: slack-clone/user-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9093 }, { containerPort: 9193 }]
          env:
            - name: USER_GRPC_ADDR
              value: ":9093"
            - name: USER_METRICS_ADDR
              value: ":9193"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@host.docker.internal:5432/slack_db?sslmode=disable"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
            - name: REDIS_ADDR
              value: host.docker.internal:6379
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector: { app: user-service }
  ports:
    - { name: grpc, port: 9093, targetPort: 9093 }
    - { name: metrics, port: 9193, targetPort: 9193 }
