name: slack-clone

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-slack_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-slack_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: golang:1.26.5
    working_dir: /workspace
    command:
      - go
      - run
      - -tags=no_mysql,no_sqlite3,no_ydb,no_clickhouse,no_mssql,no_vertica,no_libsql,no_azuresql
      - github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - -dir
      - /workspace/apps/api/sql/schema
      - postgres
      - postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-slack_db}?sslmode=disable
      - up
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  minio:
    # Keep the service name for existing S3_ENDPOINT values; RustFS provides the S3-compatible API.
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  rustfs-volume-permissions:
    image: alpine:3.22
    user: root
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - minio_data:/data
    restart: "no"

  channel-service:
    image: golang:1.26.5
    working_dir: /workspace
    command: ["go", "run", "./apps/api/services/channel/cmd/channel-service"]
    environment:
      CHANNEL_GRPC_ADDR: ":9092"
      CHANNEL_METRICS_ADDR: ":9192"
    ports:
      - "9092:9092"
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: on-failure

  user-service:
    image: golang:1.26.5
    working_dir: /workspace/apps/api/services/user
    command: ["go", "run", "./cmd/user-service"]
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-slack_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      USER_GRPC_ADDR: ":9093"
      USER_METRICS_ADDR: ":9193"
    ports:
      - "9093:9093"
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure

  storage-service:
    image: golang:1.26.5
    working_dir: /workspace/apps/api/services/storage
    command: ["go", "run", "./cmd/storage-service"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-slack_db}?sslmode=disable
      STORAGE_GRPC_ADDR: ":9094"
      STORAGE_METRICS_ADDR: ":9194"
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_PUBLIC_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: slack-uploads
      S3_USE_SSL: "false"
    ports:
      - "9094:9094"
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: on-failure

  storage-worker:
    image: golang:1.26.5
    working_dir: /workspace/apps/api/services/storage
    command: ["go", "run", "./cmd/storage-worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-slack_db}?sslmode=disable
      STORAGE_WORKER_METRICS_ADDR: ":9195"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: slack-uploads
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: on-failure

  gateway:
    image: golang:1.26.5
    working_dir: /workspace/apps/api
    command: ["go", "run", "./cmd/gateway"]
    env_file:
      - ./apps/api/.env
    environment:
      CORE_GRPC_ADDR: core:9091
      GATEWAY_GRPC_ADDR: "0.0.0.0:9090"
      GATEWAY_HTTP_ADDR: ":8081"
      REDIS_ADDR: redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8081:8081"
      - "9090:9090"
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  core:
    image: golang:1.26.5
    working_dir: /workspace/apps/api
    command: ["go", "run", "./cmd/core"]
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-slack_db}?sslmode=disable
      CORE_HTTP_ADDR: ":8080"
      CORE_GRPC_ADDR: "0.0.0.0:9091"
      CORE_NODE_ID: core-1
      CORE_NODE_ADDRESS: core:9091
      GATEWAY_GRPC_ADDR: gateway:9090
      CHANNEL_GRPC_ADDR: channel-service:9092
      USER_GRPC_ADDR: user-service:9093
      STORAGE_GRPC_ADDR: storage-service:9094
      KAFKA_BROKER_ADDR: redpanda:9092
      REDIS_ADDR: redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: slack-uploads
      S3_USE_SSL: "false"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
      - "9091:9091"
    volumes:
      - .:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      minio:
        condition: service_started
      channel-service:
        condition: service_started
      user-service:
        condition: service_started
      storage-service:
        condition: service_started
      gateway:
        condition: service_started
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9099:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8081/ws
        NEXT_PUBLIC_SENTRY_DISABLED: "true"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8081/ws
    depends_on:
      core:
        condition: service_started
      gateway:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  go-mod-cache:
  go-build-cache:
