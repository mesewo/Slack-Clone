apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames: ["host.docker.internal"]
      containers:
        - name: gateway
          image: slack-clone/gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }, { containerPort: 9090 }]
          env:
            - name: CORE_GRPC_ADDR
              value: core:9091
            - name: GATEWAY_GRPC_ADDR
              value: "0.0.0.0:9090"
            - name: GATEWAY_HTTP_ADDR
              value: ":8081"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
            - name: REDIS_ADDR
              value: host.docker.internal:6379
            - name: FRONTEND_URL
              value: http://localhost:3000
            - name: ALLOWED_ORIGINS
              value: http://localhost:3000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
    - { name: grpc, port: 9090, targetPort: 9090 }
